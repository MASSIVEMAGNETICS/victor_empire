name: closed-loop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test command center CLI
        run: |
          python command_center.py --data-dir /tmp/victor-ci --workspace /tmp/victor-artifacts run "CI closed-loop smoke test"
          python command_center.py --data-dir /tmp/victor-ci --workspace /tmp/victor-artifacts verify-chain
