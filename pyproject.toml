[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "victor-empire-kernel"
version = "0.1.0"
description = "Sovereign, model-independent control plane for Victor organs"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["victor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

